const LLAVE = 'big-clave:' + location.pathname.replace(/[^/]*$/, ''); // una clave por carpeta de deck
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = a => Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));

async function derivar(clave) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(D.sal), iterations: D.it }, base, 512));
}
async function descifrar(bits) {
  const nonce = b64(D.nonce), ct = b64(D.ct), tag = b64(D.tag);
  const hm = k => crypto.subtle.importKey('raw', k, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign', 'verify']);
  const kFirma = await hm(bits.slice(32)), kCifra = await hm(bits.slice(0, 32));
  const msg = new Uint8Array(nonce.length + ct.length); msg.set(nonce); msg.set(ct, nonce.length);
  if (!(await crypto.subtle.verify('HMAC', kFirma, tag, msg))) return null;
  const n = Math.ceil(ct.length / 32);
  const bloques = await Promise.all(Array.from({ length: n }, (_, i) => {
    const m = new Uint8Array(nonce.length + 4); m.set(nonce); new DataView(m.buffer).setUint32(nonce.length, i);
    return crypto.subtle.sign('HMAC', kCifra, m).then(b => new Uint8Array(b));
  }));
  const out = new Uint8Array(ct.length);
  for (let i = 0; i < ct.length; i++) out[i] = ct[i] ^ bloques[i >> 5][i & 31];
  return new TextDecoder().decode(out);
}
function mostrar(html) { document.open(); document.write(html); document.close(); }

async function probar(bits, recordar) {
  const html = await descifrar(bits);
  if (!html) return false;
  try { recordar ? localStorage.setItem(LLAVE, hex(bits)) : sessionStorage.setItem(LLAVE, hex(bits)); } catch {}
  mostrar(html);
  return true;
}

// Entrada automática (enlace con #clave= o clave recordada). Se espera al evento load:
// reemplazar el documento mientras todavía se está cargando no funciona en todos los navegadores.
const auto = new URLSearchParams(location.hash.slice(1)).get('clave');
// También sirve la clave guardada en una carpeta superior (p. ej. una página dentro de la guía)
const guardada = (() => { try {
  const partes = location.pathname.replace(/[^/]*$/, '').split('/').filter(Boolean);
  for (let n = partes.length; n >= 0; n--) {
    const k = 'big-clave:/' + partes.slice(0, n).join('/') + (n ? '/' : '');
    const v = localStorage.getItem(k) || sessionStorage.getItem(k); if (v) return v;
  }
  return null; } catch { return null; } })();
if (auto || guardada) document.documentElement.classList.add('auto');
async function entradaAutomatica() {
  if (!window.crypto?.subtle) { document.documentElement.classList.remove('auto'); document.getElementById('e').textContent = 'Abre este enlace con https:// en un navegador actualizado.'; return; }
  if (auto) { history.replaceState(null, '', location.pathname + location.search); if (await probar(await derivar(auto), true)) return; }
  if (guardada && await probar(unhex(guardada), true)) return;
  try { localStorage.removeItem(LLAVE); sessionStorage.removeItem(LLAVE); } catch {}
  document.documentElement.classList.remove('auto');
}
if (document.readyState === 'complete') entradaAutomatica(); else addEventListener('load', entradaAutomatica, { once: true });

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e'), k = document.getElementById('k');
  b.disabled = true; b.textContent = 'Abriendo…'; e.textContent = '';
  const ok = await probar(await derivar(k.value), document.getElementById('r').checked);
  if (!ok) {
    b.disabled = false; b.textContent = 'Entrar'; e.textContent = 'Clave incorrecta.';
    k.select(); document.querySelector('main').classList.remove('shake'); void document.body.offsetWidth; document.querySelector('main').classList.add('shake');
  }
});
