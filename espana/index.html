<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIG — Roster España (Próximamente)</title>
<style>
@font-face { font-family: 'Inter'; font-weight: 500; font-style: normal; src: url(../Inter-Medium.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Inter'; font-weight: 700; font-style: normal; src: url(../Inter-Bold.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Inter'; font-weight: 900; font-style: normal; src: url(../Inter-Black.woff2) format('woff2'); font-display: swap; }

:root {
  --azul: #33419A;
  --naranja: #F36F2C;
  --fondo: #F7D8BD;
  --negro: #0D0D14;
  --blanco: #FFFFFF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--fondo);
  color: var(--negro);
  letter-spacing: -0.01em;
  min-height: 100vh;
}

.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; padding: 18px 32px;
}
.nav-brand {
  display: flex; align-items: center; justify-content: center; cursor: pointer; border: none;
  background: var(--negro); border-radius: 12px; padding: 9px;
  transition: background .25s ease;
}
.nav-brand:hover { background: var(--azul); }
.nav-brand svg { width: 24px; height: 24px; display: block; }

.hero {
  min-height: 100vh; display: flex; align-items: center;
  background: var(--naranja);
  border-radius: 0 0 64px 64px;
  padding: 140px 32px 100px;
}
.hero-inner { width: 100%; max-width: 720px; margin: 0 auto; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--blanco); background: rgba(13,13,20,.18);
  font-weight: 700; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase;
  padding: 9px 16px; border-radius: 999px; margin-bottom: 22px;
}
h1 {
  color: var(--blanco);
  font-weight: 900; line-height: .92; letter-spacing: -0.05em; text-transform: uppercase;
  font-size: clamp(44px, 7vw, 92px);
}
p {
  margin-top: 22px; max-width: 520px; font-size: 19px; font-weight: 500;
  line-height: 1.5; color: rgba(255,255,255,.85);
}
.cta {
  display: inline-flex; align-items: center; gap: 10px; margin-top: 40px;
  background: var(--blanco); color: var(--negro); text-decoration: none;
  font-weight: 700; font-size: 14px; letter-spacing: -0.01em;
  padding: 15px 24px; border-radius: 999px;
  transition: background .2s ease, transform .2s ease;
}
.cta:hover { background: var(--fondo); transform: translateY(-2px); }
.cta .flag { font-size: 18px; }

@media (max-width: 640px) {
  .nav { padding: 14px 16px; }
  .hero { border-radius: 0 0 32px 32px; padding: 110px 20px 70px; }
}
</style>

<nav class="nav">

  </a>
</nav>

<section class="hero">
  <div class="hero-inner">
    <span class="eyebrow">🇪🇸 Roster España · Próximamente</span>
    <h1>Estamos armando<br>el roster de España</h1>
    <p>Muy pronto vas a poder descubrir acá a los talentos que representamos en España. Mientras tanto, explorá el roster de Argentina.</p>
